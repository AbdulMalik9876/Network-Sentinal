kind = "web"
previewPath = "/"
title = "NetWatch - Network Security Monitor"
version = "1.0.0"
id = "artifacts/netwatch"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24170

[services.development]
run = "pnpm --filter @workspace/netwatch run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/netwatch", "run", "build" ]
publicDir = "artifacts/netwatch/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24170"
BASE_PATH = "/"
